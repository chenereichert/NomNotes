    <script>
        window.downloadFileFromBase64 = (fileName, base64String) => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = "data:text/plain;base64," + base64String;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        // Our new JS Interop function for PDFs
        window.downloadPdfFromHtml = (htmlContent, fileName) => {
            // Configure the PDF output
            const options = {
                margin: 0.5,
                filename: fileName,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 }, // Higher scale for better text resolution
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            // This library handles generating the PDF and triggering the download automatically
            html2pdf().set(options).from(htmlContent).save();
        };
    </script>
