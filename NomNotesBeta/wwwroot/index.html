<!DOCTYPE html>
<html lang="en">

<head>
    <script type="importmap"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NomNotes</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="NomNotesBeta.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <script>
        window.downloadFileFromBase64 = (fileName, base64String) => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = "data:text/plain;base64," + base64String;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        window.printHtmlAsPdf = (htmlContent) => {
            // Open a temporary hidden window
            const printWindow = window.open('', '_blank', 'width=800,height=600');

            // Write the HTML into the new window with some print-specific CSS
            printWindow.document.write(`
                            <html>
                            <head>
                                <title>Daily Wellness Log</title>
                                <style>
                                    body { font-family: Arial, sans-serif; padding: 40px; line-height: 1.6; color: #333; }
                                    /* Hide things we don't want in the PDF */
                                    @media print {
                                        @page { margin: 0.5in; }
                                    }
                                </style>
                            </head>
                            <body>
                                ${htmlContent}
                                <script>
                                    // Wait for it to load, then open the print dialog
                                    window.onload = function() {
                                        window.print();
                                        // Optional: close the window after they print/save
                                        window.onafterprint = function() { window.close(); }
                                    };
                                <\/script>
                            <\/body>
                            <\/html>`);
            printWindow.document.close();
        };
    </script>

    <script>
        // Upgraded JS Interop function for copying Rich Text (HTML)
        window.copyRichTextToClipboard = async (htmlContent, plainTextContent) => {
            try {
                // We create two versions: the formatted HTML, and the plain text fallback
                const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
                const textBlob = new Blob([plainTextContent], { type: 'text/plain' });

                // We package them together into a ClipboardItem
                const clipboardItem = new ClipboardItem({
                    'text/html': htmlBlob,
                    'text/plain': textBlob
                });

                await navigator.clipboard.write([clipboardItem]);
                return true;
            } catch (error) {
                console.error("Rich text clipboard copy failed", error);
                // Fallback for older browsers that don't support ClipboardItem well
                try {
                    await navigator.clipboard.writeText(plainTextContent);
                    return true;
                } catch (fallbackError) {
                    return false;
                }
            }
        };
    </script>
</body>

</html>
