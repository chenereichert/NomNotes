<!DOCTYPE html>
<html lang="en">

<head>
    <script type="importmap"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NomNotes</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="NomNotesBeta.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <script>
        window.downloadFileFromBase64 = (fileName, base64String) => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = "data:text/plain;base64," + base64String;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        // Our new JS Interop function for PDFs
        window.downloadPdfFromHtml = (htmlContent, fileName) => {
            // Configure the PDF output
            const options = {
                margin: 0.5,
                filename: fileName,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 }, // Higher scale for better text resolution
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            // This library handles generating the PDF and triggering the download automatically
            html2pdf().set(options).from(htmlContent).save();
        };
    </script>

</body>

</html>
